[project]
name = "project-relatorios"
version = "0.1.0"
description = "Gerador de relatórios institucionais"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "jinja2>=3.1.0",
  "requests>=2.31.0",
  "pypdf>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
